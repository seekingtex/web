  - id: sustainable-jacket-fabric-development
    client: Leading US Premium Outdoor Brand (Anonymous)
    product: PFC-Free Waterproof Jacket Fabric — C0 DWR 3L/2.5L Laminate
    industry: Outdoor Apparel
    challenge: Leading US premium outdoor brand needed to transition flagship waterproof jacket collection from C6 DWR to PFC-free C0 DWR ahead of the 2027 EU PFAS ban while maintaining 20K mm hydrostatic head and breathability performance.
    solution: Seekingtex developed dendrimer-based C0 DWR across 3-layer (50D nylon 6.6 with PTFE membrane, 21,500 mm) and 2.5-layer (40D recycled nylon with PU membrane, 16,200 mm) constructions. Comprehensive 12-week wash-testing validated spray rating of 95 initial / 85 after 20 washes.
    result: Approved for full 2027 spring/summer jacket collection across 8 models in 3 categories. Transition completed 14 months ahead of EU PFAS ban deadline with verified performance parity.
    image: /images/seekingtex/products/eco-friendly-fabric.webp
    tags: [Outdoor, Sustainable, Waterproof, PFC-Free, Regulatory]
    fullArticle: true
    outcome_metrics:
      - label: Hydrostatic Head
        value: 20K+ mm
      - label: DWR after 20 washes
        value: '85'
      - label: Completion
        value: 14 months ahead

