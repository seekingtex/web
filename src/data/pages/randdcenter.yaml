pillars:
  - title: Technological Advancement
    desc: Pioneering new fibers, yarns, weaves, and finishing technologies to deliver superior fabric performance and durability.
    icon: tech
  - title: Advanced Materials
    desc: Investigating cutting-edge polyester, nylon, elastane, recycled fibers, bio-based alternatives, and functional coating systems for enhanced fabric characteristics.
    icon: materials
  - title: Sustainability
    desc: 'A Core Commitment: Dedicated to environmental stewardship through sustainable manufacturing, recycled fibers, and low-impact processes.'
    icon: sustainability

capabilities:
  tagline: Capabilities
  title: R&D Capabilities
  subtitle: Four core disciplines that give us end-to-end control over textile development—from raw material research to finished fabric certification.
  groups:
    - title: Fiber & Yarn Technology
      items:
        - Custom fiber blending, yarn spinning, and filament texturing
        - Recycled polyester (rPET) and bio-based nylon development
        - Core-spun, air-jet textured, and filament/twisted yarn engineering
        - Fiber cross-section modification for moisture management and opacity
    - title: Fabric Engineering & Design
      items:
        - Weave and knit construction design and optimization
        - 3D fabric simulation and CAD-based pattern engineering
        - Multi-layer and laminated fabric structure development
        - Custom fabric development for specific end-use performance targets
    - title: Finishing & Coating Technology
      items:
        - DWR, antimicrobial, UV-blocking, and FR finish development
        - PU, PVC, acrylic, and silicone coating formulation and application
        - Hot-melt and adhesive lamination process optimization
        - Finish durability testing: wash resistance, abrasion, and aging
    - title: Testing, Certification & Compliance
      items:
        - Quality management and OEKO-TEX / CE compliance testing
        - Independent third-party testing and certification support
        - Custom test protocol development for procurement qualification
        - In-service failure analysis and root-cause investigation

