rd_services:
  tagline: Custom R&D
  title: R&D Services for Partners
  services:
    - title: Custom Fabric Development
      desc: We develop custom fiber blends, fabric constructions, finish formulations, and laminate stacks tailored to your performance targets and end-use requirements.
    - title: OEM / ODM Product Engineering
      desc: From concept sketches to production-ready specifications—our team can design, prototype, and validate fabrics under your brand.
    - title: Third-Party Testing & Certification
      desc: Use our ISO-compliant test facilities for independent fabric testing, product validation, and certification support.
  cta: Discuss your R&D requirements →
  cta_link: /contact

vision:
  tagline: Our Vision
  title: Shaping the Future of Textiles
  body: Seekingtex strives to lead the functional fabrics industry through continuous innovation, unwavering quality, and a steadfast commitment to safety and sustainability—ultimately enriching the experience of apparel and gear brands worldwide. The Seekingtex R&D Center is where passion meets innovation, setting new standards for the textile industry.

labs_section:
  tagline: Labs
  title: Our Laboratories
  labs:
    - image: /images/seekingtex/randd/Seekingtex-pvc-material-lab.webp
      title: Fabric Formulation Lab
      description: Continuous research and testing of fabric formulations including fiber blends, weave constructions, and functional finishes. Performance testing for tensile strength, UV resistance, abrasion, and wash durability.
      href: /randdcenter/pvc-fabric-lab
    - image: /images/seekingtex/factory/design discuss2.jpeg
      title: Textile Engineering Studio
      description: CAD-driven fabric design and finite element analysis of woven and knitted structures. Every construction is digitally simulated for strength, stretch, and drape before the first sample is produced.
      href: /randdcenter/fabric-engineering
    - image: /images/seekingtex/factory/functional fabric making3.jpeg
      title: Coating & Lamination Lab
      description: Dedicated coating and lamination facility with precision temperature and pressure control, producing high-performance finished fabrics that meet textile industry standards for quality and consistency.
      href: /randdcenter/rf-welding
    - image: /images/seekingtex/factory/design discuss original.jpeg
      title: Performance Testing Laboratory
      description: Comprehensive testing for moisture management, water repellency, air permeability, thermal resistance, and colorfastness across a range of fabric constructions and finish types.
      href: /randdcenter/performance-testing-lab
    - image: /images/seekingtex/products/functional fabric-series/functional fabric-ocean-voyager-1.webp
      title: Prototype Workshop
      description: Full-scale prototyping facility where new fabric designs, finished samples, and custom developments are produced, evaluated, and refined. Every prototype undergoes comprehensive testing before production approval.
      href: /randdcenter/prototype-workshop
    - image: /images/seekingtex/factory/UV Resistance Testing.jpeg
      title: Quality & Inspection Lab
      description: Dedicated quality assurance lab performing tensile testing, dimensional measurement, seam strength tests, and material certification to ensure every fabric roll meets our published specifications.
      href: /randdcenter/quality-inspection-lab
