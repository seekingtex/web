hero:
  tagline: R&D Center
  title: R & D Center
  subtitle: Focused on Progress

intro:
  - Seekingtex's Research and Development (R&D) Center is the driving force behind our mission to advance functional textile technology. We empower apparel and gear brands globally with safer, more comfortable, and higher-performance fabrics through relentless innovation in textile engineering. Our dedicated team of engineers, scientists, and textile experts are shaping the future of performance fabrics, consistently raising the bar for quality, performance, and sustainability.
  - Our R&D facility brings together material scientists, textile engineers, and production specialists under one roof. From fiber formulation and fabric construction to finish development and comprehensive performance testing, every stage of product development is driven by data and validated by rigorous testing.

mission:
  tagline: Our Mission
  title: Innovating the Future of Textiles
  pillars:
    - icon: lightning
      title: Technological Advancement
      desc: Pioneering new fibers, fabric constructions, and finishing technologies for superior performance and longevity.
    - icon: design
      title: User-Centric Design
      desc: Deeply understanding and exceeding end-user needs through ergonomic and application-specific fabric design.
    - icon: globe
      title: Sustainable Practices
      desc: Minimizing environmental footprint by utilizing eco-friendly fibers, low-impact dyes, and resource-efficient processes.
    - icon: shield
      title: Uncompromising Safety
