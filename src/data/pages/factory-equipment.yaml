hero:
  tagline: Equipment
  title: Manufacturing Equipment & Machinery
  subtitle: Industrial-grade equipment across weaving, knitting, finishing, and testing
  back_label: Back to Factory
  back_link: /factory

categories:
  - title: Weaving & Knitting
    items:
      - name: High-Speed Rapier Weaving Loom
        spec: 190–360 cm width, 650 rpm max, electronic dobby
        desc: Computer-controlled rapier loom for weaving performance fabrics with precise yarn tension control. Supports polyester, nylon, cotton, elastane, and blended yarns in plain, twill, satin, and specialty weaves.
      - name: Circular Knitting Machine
        spec: 30"–38" diameter, 18–32 gauge, 90 feeders
        desc: High-speed circular knitting machine for producing jersey, pique, fleece, and rib-knit fabrics. Equipped with positive feed and yarn tension monitoring for consistent fabric quality.

  - title: Dyeing & Finishing
    items:
      - name: High-Temperature Dyeing Machine
        spec: 130 °C max, 1:4–1:10 liquor ratio, programmable
        desc: Pressurized jet dyeing machine for polyester, nylon, and blended fabrics. Precision temperature and pressure control ensures uniform dye penetration and color consistency across batches.
      - name: Stenter Finishing Frame
        spec: 8-chamber, 200–240 cm width, hot-air circulation
        desc: Multi-chamber stenter for heat-setting, drying, and finishing of woven and knitted fabrics. Applies DWR, antimicrobial, UV-blocking, and other functional finishes with uniform coverage.
      - name: Padding Mangle
        spec: 2-roll vertical, pneumatic pressure control, 70–90 % pick-up
        desc: Horizontal padding mangle for chemical application in finishing processes. Consistent squeeze pressure ensures even pick-up of functional finishes across fabric width.

  - title: Coating & Lamination
    items:
      - name: Knife-Over-Roll Coating Head
        spec: 200–220 cm working width, adjustable gap 0.1–5 mm
        desc: Precision coating head for applying PU, PVC, acrylic, and silicone coatings to fabric surfaces. Adjustable blade gap controls coating thickness for consistent performance properties.
      - name: Hot-Melt Laminating Line
        spec: 3-roll configuration, 180–200 °C, 5–20 m/min
        desc: Continuous hot-melt laminating line for bonding membrane layers to fabric substrates. Used for waterproof breathable laminate production and multi-layer fabric construction.

  - title: Printing & Decoration
    items:
      - name: Digital Rotary Screen Printer
        spec: 16–20 colour stations, 1.6–2.0 m print width
        desc: High-precision rotary screen printer for applying performance coatings and surface finishes. Direct-to-fabric digital printing also available for customized patterns and brand markings.
      - name: Heat Transfer Printing Press
        spec: 200×150 cm platen, 180–220 °C, pneumatic pressure
        desc: Heat transfer press for applying sublimation prints and functional films onto finished fabrics. Temperature-controlled platen ensures consistent transfer quality.

  - title: Cutting & Preparation
    items:
      - name: Automatic Fabric Spreading Machine
        spec: 2.2 m max width, tension-controlled feed, 50 m/min
        desc: Computer-controlled spreading machine lays fabric in single or multiple plies with controlled tension to prevent distortion before cutting. Integrated flaw detection system marks defects.
      - name: CNC Fabric Cutting System
        spec: 2.5 m × 3.5 m cutting area, 80 m/min, 0.1 mm accuracy
        desc: Automated cutting system with reciprocating knife and drill attachment. Nesting software optimizes material utilization. Cuts multiple plies simultaneously for production efficiency.

  - title: Testing & Quality Control
    items:
      - name: Universal Tensile Tester
        spec: 50 kN, ISO / ASTM D5034
        desc: Breaking force, elongation at break, and tear propagation testing for fabric batches. Full data logging per ASTM D5034 and ISO 13934 standards.
      - name: Xenon-Arc Weathering Chamber
        spec: 2000 h exposure, ISO 105-B02
        desc: Accelerated UV aging and lightfastness testing for color change, strength retention, and coating degradation. Simulates years of sunlight exposure in weeks.
      - name: Hydrostatic Head Tester
        spec: 0–50 mbar, ISO 811 / AATCC 127
        desc: Automated hydrostatic pressure testing for waterproof fabric rating. Programmable pressure ramp rate with real-time data recording.
      - name: Spectrophotometer
        spec: D65 illuminant, 10° observer, 400–700 nm
        desc: Computerized color measurement system for pass/fail color matching against reference standards. CIE Lab color difference reporting for batch consistency.

