  - title: Fabric Development Services
    subtitle: From concept to production — we help you create the perfect fabric for your brand
    items:
      - title: Custom Fabric Development
        description: Work with our R&D team to develop bespoke fabrics tailored to your specifications
        href: /fabric-development
      - title: Low MOQ Startup Program
        description: Launch your brand with flexible minimum order quantities and sample support
        href: /startup-brand-program
      - title: Request a Quote
        description: Send us your requirements and get a competitive quotation within 24 hours
