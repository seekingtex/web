      - title: Waterproof & Breathable
        slug: waterproof-fabric
        href: /waterproof-fabric
      - title: Quick-Dry
        slug: quick-dry-fabric
        href: /quick-dry-fabric
      - title: Antibacterial
        slug: antibacterial-fabric
        href: /antibacterial-fabric
      - title: Stretch & Recovery
        slug: stretch-fabric
        href: /stretch-fabric
      - title: Breathable Mesh
        slug: breathable-fabric
        href: /breathable-fabric
      - title: Eco-Friendly
        slug: eco-friendly-fabric
        href: /eco-friendly-fabric
      - title: Flame Retardant
        slug: flame-retardant-fabric
